<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Wave 🎸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="auth-section">
  <h2>🔑 Login / Registrierung</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Passwort">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Registrieren</button>
  <p id="auth-status"></p>
</section>

<!-- ================= MAIN CONTENT ================= -->
<div id="main-content">

  <button onclick="logout()">Abmelden</button>

  <!-- ================= GIGS ================= -->
  <section class="section">
    <div class="section-header" onclick="toggleSection('gigs-content')">📅 Auftritte & Proben</div>
    <div class="section-content" id="gigs-content">
      <input id="gig-name" placeholder="Name">
      <input id="gig-date" type="date">
      <textarea id="gig-notes" placeholder="Notizen"></textarea>
      <button id="add-gig-btn">➕ Hinzufügen</button>
      <ul id="gigs-list"></ul>
    </div>
  </section>

  <!-- ================= SONGS ================= -->
  <section class="section">
    <div class="section-header" onclick="toggleSection('songs-content')">🎵 Songs</div>
    <div class="section-content" id="songs-content">
      <input id="song-name" placeholder="Song-Name">
      <input id="song-duration" placeholder="mm:ss">
      <input id="song-link" placeholder="YouTube-Link">
      <button id="add-song-btn">➕ Vorschlagen</button>

      <!-- Song-Bibliothek -->
      <input type="text" id="song-search" placeholder="Suche Song...">
      <ul id="library-list"></ul>
    </div>
  </section>

  <!-- ================= GIG DETAIL & SETLIST ================= -->
  <section class="section" id="gig-detail-section">
    <div class="section-header" onclick="toggleSection('gig-detail-content')">
      <span id="gig-title">Gig Detail</span>
    </div>
    <div class="section-content" id="gig-detail-content">
      <p id="gig-notes-view"></p>
      <ul id="setlist"></ul>
      <p>Gesamtdauer: <span id="total-time">00:00</span></p>
    </div>
  </section>

  <!-- ================= TECH-RIDER ================= -->
  <section class="section">
    <div class="section-header" onclick="toggleSection('techrider-content')">🎛️ Tech-Rider</div>
    <div class="section-content" id="techrider-content">
      <input type="file" id="techrider-file" accept=".pdf">
      <button id="upload-techrider-btn">Upload PDF</button>
      <p><a id="techrider-link" href="#" target="_blank" class="hidden">📄 Gespeicherten Tech-Rider öffnen</a></p>
    </div>
  </section>

  <!-- ================= BANDKASSE ================= -->
  <section class="section">
    <div class="section-header" onclick="toggleSection('cash-content')">💰 Bandkasse</div>
    <div class="section-content" id="cash-content">
      <input id="cash-amount" type="number" step="0.01" placeholder="Neuer Betrag (€)">
      <button id="cash-btn">Aktualisieren</button>
      <p>Aktuell: <span id="current-cash">0.00 €</span></p>
    </div>
  </section>

  <!-- ================= MERCH ================= -->
  <section class="section">
    <div class="section-header" onclick="toggleSection('merch-content')">👕 Merch Lager</div>
    <div class="section-content" id="merch-content">
      <div id="merch-grid"></div>
    </div>
  </section>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
