<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandmanagement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="auth-section">
  <h2>Login / Registrierung</h2>
  <input type="email" id="email" placeholder="E-Mail"><br>
  <input type="password" id="password" placeholder="Passwort"><br>
  <button onclick="login()">Login</button>
  <button onclick="signup()">Registrieren</button>
  <p id="auth-status"></p>
</section>

<!-- ================= HAUPTBEREICH ================= -->
<main id="main-content" class="hidden">

  <!-- ================= GIGS ================= -->
  <section class="section" id="gigs-section">
    <div class="section-header">Gigs</div>
    <div class="section-content">
      <input type="text" id="gig-name" placeholder="Gigname">
      <input type="date" id="gig-date">
      <input type="text" id="gig-notes" placeholder="Notizen">
      <button id="add-gig-btn">Hinzufügen</button>
      <ul id="gigs-list"></ul>

      <div id="gig-detail-section" class="hidden">
        <h3 id="gig-title"></h3>
        <p id="gig-notes-view"></p>
        <ul id="setlist" ondragover="allowDrop(event)" ondrop="drop(event)"></ul>
        <p>Total: <span id="total-time">00:00</span></p>
      </div>
    </div>
  </section>

  <!-- ================= SONGS ================= -->
  <section class="section" id="songs-section">
    <div class="section-header">Songs</div>
    <div class="section-content">
      <input type="text" id="song-name" placeholder="Songname">
      <input type="text" id="song-duration" placeholder="Dauer z.B. 03:45">
      <input type="text" id="song-link" placeholder="Link (optional)">
      <button id="add-song-btn">Song hinzufügen</button>
      <input type="text" id="song-search" placeholder="Suche...">
      <ul id="library-list"></ul>
    </div>
  </section>

  <!-- ================= TECH-RIDER ================= -->
  <section class="section" id="techrider-section">
    <div class="section-header">Tech-Rider</div>
    <div class="section-content">
      <input type="file" id="techrider-file">
      <button id="upload-techrider-btn">Hochladen</button>
      <a id="techrider-link" class="hidden" target="_blank">Link anzeigen</a>
    </div>
  </section>

  <!-- ================= BANDKASSE ================= -->
  <section class="section" id="cash-section">
    <div class="section-header">Bandkasse</div>
    <div class="section-content">
      <input type="number" id="cash-amount" placeholder="Betrag eingeben">
      <button id="cash-btn">Speichern</button>
      <p>Aktueller Stand: <span id="current-cash">0.00 €</span></p>
    </div>
  </section>

  <!-- ================= MERCH ================= -->
  <section class="section" id="merch-section">
    <div class="section-header">Merch</div>
    <div class="section-content">
      <div id="merch-grid"></div>
      <p><a href="#">Merch nachbestellen</a></p>
    </div>
  </section>

  <!-- ================= LOGOUT ================= -->
  <button onclick="logout()" style="margin-top:20px;">Abmelden</button>

</main>

<script src="script.js" type="module"></script>
</body>
</html>
